<!doctype html><html lang="en"><head><meta charset="utf-8"><title>지금 어느 화면인가</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#08090A;color:#E6EBE6;font-family:'Geist', 'Noto Sans KR', sans-serif;padding:40px}
.eyebrow{font-family:'Geist Mono', 'Noto Sans KR', monospace;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:#6B776F;margin:0 0 8px}

<p class="eyebrow">pilo</p><h1>지금 어느 화면인가</h1>
<svg viewBox="4 36 952 259" role="img" aria-labelledby="pirep-screens-dark-title pirep-screens-dark-desc" xmlns="http://www.w3.org/2000/svg">
    <title id="pirep-screens-dark-title">지금 어느 화면인가</title>
    <desc id="pirep-screens-dark-desc">The one-line install goes straight from the terminal to the pirep screen that asks for a folder, and from there to the Knowledge Inbox.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8B968E"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#3ED49C"/></marker>
    </defs>
    <rect x="4" y="36" width="952" height="259" fill="#08090A"/>
    <line x1="260" y1="104" x2="370" y2="104" stroke="#3ED49C" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <rect x="262" y="74" width="107" height="14" rx="2" fill="#08090A"/>
    <text x="315" y="84" fill="#3ED49C" font-size="8" font-family="'Geist Mono', 'Noto Sans KR', monospace" text-anchor="middle" letter-spacing="0.08em">open -a pirep</text>

    <rect x="572" y="74" width="107" height="14" rx="2" fill="#08090A"/>

    <rect x="60" y="64" width="200" height="88" rx="6" fill="#08090A"/>
    <rect x="60" y="64" width="200" height="88" rx="6" fill="#0B0E0D" stroke="#E6EBE6" stroke-width="1"/>
    <rect x="68" y="72" width="60" height="12" rx="2" fill="none" stroke="#E6EBE6" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="98" y="81" fill="#E6EBE6" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', 'Noto Sans KR', monospace" text-anchor="middle" letter-spacing="0.08em">TERMINAL</text>
    <text x="160" y="104" fill="#E6EBE6" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">내 터미널</text>
    <text x="160" y="122" fill="#8B968E" font-size="9" font-family="'Geist Mono', 'Noto Sans KR', monospace" text-anchor="middle">curl … | sh</text>
    <rect x="370" y="64" width="200" height="88" rx="6" fill="#08090A"/>
    <rect x="370" y="64" width="200" height="88" rx="6" fill="#12281F" stroke="#3ED49C" stroke-width="1"/>
    <rect x="378" y="72" width="84" height="12" rx="2" fill="none" stroke="#3ED49C" stroke-opacity="0.4" stroke-width="0.8"/>
    <text x="420" y="81" fill="#3ED49C" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', 'Noto Sans KR', monospace" text-anchor="middle" letter-spacing="0.08em">FIRST SCREEN</text>
    <text x="470" y="104" fill="#E6EBE6" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">pirep 이 열려요</text>
    <text x="470" y="122" fill="#8B968E" font-size="9" font-family="'Geist Mono', 'Noto Sans KR', monospace" text-anchor="middle">폴더를 물어봐요</text>

    <rect x="688" y="72" width="54" height="12" rx="2" fill="none" stroke="#E6EBE6" stroke-opacity="0.4" stroke-width="0.8"/>

    <text x="780" y="104" fill="#E6EBE6" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">Knowledge Inbox</text>

    <text x="168" y="264" fill="#8B968E" font-size="9" font-family="'Geist', 'Noto Sans KR', sans-serif">한 줄, 그다음 화면 둘</text>

</body></html>
