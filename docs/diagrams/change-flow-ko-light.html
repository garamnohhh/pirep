<!doctype html><html lang="en"><head><meta charset="utf-8"><title>파일이 바뀌면 무슨 일이 생기나</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Geist:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<p class="eyebrow">pilo</p><h1>파일이 바뀌면 무슨 일이 생기나</h1>
<svg viewBox="4 152 1012 403" role="img" aria-labelledby="change-flow-light-title change-flow-light-desc" xmlns="http://www.w3.org/2000/svg">

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#59635C"/></marker>

    </defs>

    <text x="194" y="212" fill="#101413" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">파일이 바뀌어요</text>

    <text x="514" y="212" fill="#101413" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">그 판을 보관해요</text>

    <text x="746" y="197" fill="#0B6B4A" fill-opacity="0.8" font-size="7" font-family="'Geist Mono', 'Noto Sans KR', monospace" text-anchor="middle" letter-spacing="0.08em">DIFF</text>
    <text x="834" y="212" fill="#101413" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', sans-serif" text-anchor="middle">단어 단위로 보여줘요</text>

    <rect x="380" y="380" width="228" height="72" rx="6" fill="#F4F6F4"/>
    <rect x="380" y="380" width="228" height="72" rx="6" fill="#FFFFFF" stroke="#101413" stroke-width="1"/>

    <line x1="32" y1="504" x2="988" y2="504" stroke="rgba(16,20,19,0.12)" stroke-width="0.8"/>

    <line x1="334" y1="520" x2="362" y2="520" stroke="#59635C" stroke-width="1.2" stroke-dasharray="5,4"/>
    <text x="370" y="524" fill="#59635C" font-size="9" font-family="'Geist', 'Noto Sans KR', sans-serif">되돌리기</text>
</svg>
</body></html>
