<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pirep Quick Look</title>
  </head>
  <body>
    <div id="root">pirep preview loading…</div>
    <script>
      function showPreviewError(message) {
        const root = document.getElementById("root");
        if (root) root.textContent = `Preview error: ${message}`;
      }
      window.onerror = (_message, _source, _line, _column, error) => {
        showPreviewError(error?.stack || String(_message));
      };
      window.onunhandledrejection = ({ reason }) => {
        showPreviewError(reason instanceof Error ? reason.stack || reason.message : String(reason));
      };
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
